; Secret-Optimizer Configuration
; Personal Windows optimization, recovery & repair suite

[Remote]
; Repository used for auto-update checks and installer downloads.
; This repository is public, so no token or GitHub account is required.
api_endpoint = https://api.github.com/repos/MrSecret-Official/Secret-Tools-Win

[Logging]
enable_logging = true
log_directory = logs
log_filename = activity.log

[Features]
ram_optimizer = true
bloatware_remover = true
system_diagnosis = true
repair_boot = true
repair_sfc = true
repair_dism = true
check_disk = true
network_repair = true
update_repair = true
emergency_admin = true
view_logs = true
health_report = true
restore_points = true
bitlocker_key = true
driver_backup = true
